server {
    listen 80;
    listen [::]:80;
    server_name app.omnigram.top;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.omnigram.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name app.omnigram.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.omnigram.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.omnigram.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # For React Router to work correctly on nested paths
        try_files $uri $uri/ /index.html;
    }
}
