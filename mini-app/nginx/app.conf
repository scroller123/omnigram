server {
    listen 80;
    listen [::]:80;
    server_name app.omnigram.top omnigram-app;
    server_tokens off;

    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # location / {
    #     return 301 https://app.omnigram.top$request_uri;
    # }
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # For React Router to work correctly on nested paths
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://telegai_api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeouts for enrichment/search
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
}

