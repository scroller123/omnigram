version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: telegai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: telegai_ollama
    environment:
      OLLAMA_VULKAN: 1
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
