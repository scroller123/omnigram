services:
  db:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: pgvector/pgvector:pg15
    container_name: telegai_postgres
    env_file:
      - .env
    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER:-postgres}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    #   POSTGRES_DB: ${POSTGRES_DB:-telegai}
    ports:
      - "35533:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - omniram-app_omnigram_miniapp_network
    restart: unless-stopped

  ollama:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    image: ollama/ollama:0.18.0
    container_name: telegai_ollama
    environment:
      OLLAMA_VULKAN: 1
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_CONTEXT_LENGTH: 1024
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_DEBUG: 1
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - omniram-app_omnigram_miniapp_network
    restart: unless-stopped

networks:
  omniram-app_omnigram_miniapp_network:
    external: true

volumes:
  postgres_data:
  ollama_data:
