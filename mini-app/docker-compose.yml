version: '3.8'

services:
  omnigram-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # The reload loop allows nginx to pick up renewed certificates automatically
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    networks:
      - omnigram_miniapp_network

  telegai_api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=8080
      - DB_HOST=telegai_postgres
      - OLLAMA_URL=http://telegai_ollama:11434
    depends_on:
      - omnigram-app # Optional, but Nginx needs it
    networks:
      - omnigram_miniapp_network

  # certbot:
  #   image: certbot/certbot
  #   container_name: miniapp_certbot
  #   restart: unless-stopped
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   # The renew loop wakes up every 12 hours, checks if cert needs renewal, and renews it
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - miniapp_network

networks:
  omnigram_miniapp_network:
    driver: bridge
